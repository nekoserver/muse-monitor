name = "muse-monitor"
main = "src/index.ts"
compatibility_date = "2026-11-10"

# The receiver address (muse-vm, tailnet :8090) is a fixed counterpart
# and is held as a constant in src/do.ts, not as a variable here.
[durable_objects]
bindings = [
  { name = "MONITOR_GATEWAY", class_name = "MonitorGateway" }
]

# /health でデプロイした版(ID・時刻)を返すため。
[version_metadata]
binding = "CF_VERSION_METADATA"

# Workers Builds のブランチのビルドは `npx wrangler preview` を実行する。previews の設定が無いとそこで失敗する。
[previews.version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MonitorGateway"]

# Secrets (set by the operator; never committed):
#   TS_AUTHKEY - Tailscale-issued auth key; the WASM node joins the tailnet with it (join only, never sent to the receiver)
#   TS_API_KEY - operator-chosen receiver key; the DO presents it to the receiver as the Bearer (receiver only). The receiver reads the same value from its key file on muse-vm. It is never used to join the tailnet
#   WORKER_API_KEY - Bearer key callers must present to /api/*; also signs the login cookie
#   MONITOR_HMAC_SECRET - shared secret for the main Worker's HMAC-signed calls to /api/hmac/* (set the same value there)
# Full ledger: docs/KEY_LEDGER.md
